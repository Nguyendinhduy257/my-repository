<html>
    <head>
        <title>hello</title>
    </head>
    <style>
        h1{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        hr{
            width: 20%;
            background-color: royalblue;
            padding: 2px;
            
        }
        .table{
            display: flex;
            width: 100%;
            height: 50px;
            
            margin-left: 30px;
            margin-right: 30px;
        }
        div{
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 50px;
        }
        .box:hover{
            display: flex;
            cursor: pointer;
            color: blueviolet;
        }
        .table2{
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: auto;
        }
        .table3{
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: auto;
        }
        .table4{
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: auto;
    
        }
        .box2{
            background-color: powderblue;
            padding: 30px;
            border: 1px solid black;
            box-sizing: border-box;
            margin: 10px;
        }
    </style>
    <body>
        <h1><b>My Portfolio</b></h1>
        <hr>
        <div class="table">
            <div>
                <div class="box"><h3>content1   |</h3></div>
                <div class="box"><h3>content2   |</h3></div>
                <div class="box"><h3>content3   |</h3></div>
                <div class="box"><h3>content4   |</h3></div>
            </div>
        </div>
        <br>
        <br>
        <div class="table2">
            <div class="box2"> products</div>
            <div class="box2">products</div>
            <div class="box2">products</div>
        </div>
        <div class="table3">
            <div class="box2">products</div>
            <div class="box2">products</div>
            <div class="box2">products</div>
        </div>
        <div class="table4">
            <div class="box2">products</div>
            <div class="box2">products</div>
            <div class="box2">products</div>
        </div>
    </body>
</html>
